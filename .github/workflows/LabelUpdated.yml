
name: On issue label change

on:
  issues:
    types: [labeled, unlabeled]

permissions:
  issues: write

jobs:
  Update_Order:
    runs-on: ubuntu-latest

    steps:
      - name: Update issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const issue_number = context.payload.issue.number;

            const { data: comments } = await github.rest.issues.listComments(
            {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            if (comments.length < 1)
            {
              core.info(`No comments found (${comments.length}). Nothing to update.`);
              return;
            }

            const last = comments[comments.length - 1];

            await github.rest.issues.updateComment(
            {
              owner,
              repo,
              comment_id: last.id,
              body: "data:image/png;base64,"
            });

            core.info(`Updated comment_id=${last.id} on issue #${issue_number}`);

            await github.rest.issues.update(
            {
              owner,
              repo,
              issue_number,
              state: "closed"
            });

            core.info(`Closed issue #${issue_number}`);
